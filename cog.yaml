# Cog build for Replicate - CompVis safety-checker only (no full SD1.5).
# Matches local run_filter.py behavior with tunable NSFW / special-care sensitivity.
build:
  gpu: true
  python_version: "3.11"
  python_requirements: requirements-cog.txt
  run:
    - |
      python -c "from pathlib import Path; from transformers import CLIPImageProcessor; from diffusers.pipelines.stable_diffusion.safety_checker import StableDiffusionSafetyChecker; c=Path('diffusers-cache'); c.mkdir(parents=True, exist_ok=True); print('Downloading CompVis/stable-diffusion-safety-checker'); StableDiffusionSafetyChecker.from_pretrained('CompVis/stable-diffusion-safety-checker', cache_dir=str(c)); print('Downloading openai/clip-vit-large-patch14'); CLIPImageProcessor.from_pretrained('openai/clip-vit-large-patch14', cache_dir=str(c)); print('Weights ready.')"
predict: "predict.py:Predictor"